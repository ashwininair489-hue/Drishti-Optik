<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Drishti-Optik wordmark">
  <defs>
    <linearGradient id="do-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c86ff"/><stop offset="55%" stop-color="#6fb8e8"/><stop offset="100%" stop-color="#5ec4d4"/>
    </linearGradient>
    <radialGradient id="do-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2744"/><stop offset="58%" stop-color="#1e3a5e"/><stop offset="100%" stop-color="#0f1d33"/>
    </radialGradient>
  </defs>
  <!-- mark -->
  <g>
    <rect x="8" y="8" width="144" height="144" rx="34" fill="url(#do-bg)"/>
    <circle cx="80" cy="80" r="44" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="2.4"/>
    <circle cx="80" cy="80" r="35" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.2" stroke-dasharray="5 5"/>
    <circle cx="80" cy="80" r="26" fill="url(#do-iris)" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="17" fill="none" stroke="#7fd4ee" stroke-width="1.7"/>
    <circle cx="80" cy="80" r="8.2" fill="#0b1628" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <ellipse cx="75.5" cy="73.5" rx="3.8" ry="2.8" fill="rgba(255,255,255,0.72)"/>
    <g stroke="#f6f8ff" stroke-linecap="round">
      <path d="M80 32 V48 M80 112 V128 M32 80 H48 M112 80 H128" stroke-width="3" fill="none"/>
      <circle cx="80" cy="80" r="1.9" fill="#f6f8ff" stroke="none"/>
    </g>
  </g>
  <!-- wordmark -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="176" y="82" font-size="46" font-weight="800" letter-spacing="-0.03em" fill="#1a2145">DRISHTI</text>
    <text x="176" y="82" font-size="46" font-weight="800" letter-spacing="-0.03em" fill="url(#do-bg)" opacity="0">DRISHTI</text>
    <text x="176" y="122" font-size="46" font-weight="300" letter-spacing="0.14em" fill="#1a2145">OPTIK</text>
  </g>
  <g font-family="JetBrains Mono, monospace">
    <text x="178" y="144" font-size="11.5" font-weight="500" letter-spacing="0.16em" fill="#5c6694">VIRTUAL CAMERA TRACKING · FSOC COARSE ALIGNMENT</text>
  </g>
  <!-- subtle animated crosshair in the wordmark's negative space for liveliness -->
  <g transform="translate(432 80)" opacity="0.18">
    <g stroke="#5c6694" stroke-width="1.4" stroke-linecap="round" class="spin-cross">
      <path d="M-14 0 H-4 M14 0 H4 M0 -14 V-4 M0 14 V4"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#5c6694" stroke-width="1.1" class="dash-ring"/>
    <circle cx="0" cy="0" r="1.4" fill="#5c6694"/>
  </g>
  <style>
    @keyframes crosshair-rotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes ring-pulse { 0%,100%{opacity:0.7} 50%{opacity:0.25} }
    .spin-cross { transform-box: fill-box; transform-origin: center; animation: crosshair-rotate 20s linear infinite; }
    .dash-ring { animation: ring-pulse 4s ease-in-out infinite; }
  </style>
</svg>
