<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Drishti-Optik social preview">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef1fa"/><stop offset="100%" stop-color="#dfe6f7"/>
    </linearGradient>
    <linearGradient id="og-mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c86ff"/><stop offset="55%" stop-color="#6fb8e8"/><stop offset="100%" stop-color="#5ec4d4"/>
    </linearGradient>
    <radialGradient id="og-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2744"/><stop offset="58%" stop-color="#1e3a5e"/><stop offset="100%" stop-color="#0f1d33"/>
    </radialGradient>
    <filter id="og-clay" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="10" stdDeviation="14" flood-color="#7a83b8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <g stroke="#b9c1e2" stroke-width="1" opacity="0.45">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M100 0v630M200 0v630M300 0v630M400 0v630M500 0v630M600 0v630M700 0v630M800 0v630M900 0v630M1000 0v630M1100 0v630"/>
  </g>
  <!-- card -->
  <rect x="56" y="56" width="1088" height="518" rx="48" fill="#f6f8ff" filter="url(#og-clay)"/>
  <rect x="56" y="56" width="1088" height="518" rx="48" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
  <!-- mark -->
  <g transform="translate(102 148)">
    <rect x="0" y="0" width="128" height="128" rx="32" fill="url(#og-mark)"/>
    <circle cx="64" cy="64" r="40" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="2.2"/>
    <circle cx="64" cy="64" r="31" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.1" stroke-dasharray="4.5 4.5"/>
    <circle cx="64" cy="64" r="23" fill="url(#og-iris)" stroke="rgba(255,255,255,0.8)" stroke-width="1.2"/>
    <circle cx="64" cy="64" r="15" fill="none" stroke="#7fd4ee" stroke-width="1.4"/>
    <circle cx="64" cy="64" r="7.2" fill="#0b1628"/>
    <ellipse cx="60" cy="58.5" rx="3.4" ry="2.5" fill="rgba(255,255,255,0.7)"/>
    <g stroke="#f6f8ff" stroke-linecap="round" fill="none">
      <path d="M64 26 V40 M64 88 V102 M26 64 H40 M88 64 H102" stroke-width="2.6"/>
      <circle cx="64" cy="64" r="1.6" fill="#f6f8ff" stroke="none"/>
    </g>
  </g>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="102" y="348" font-size="72" font-weight="800" fill="#1a2145" letter-spacing="-0.03em">DRISHTI<tspan font-weight="300" letter-spacing="0.12em">-OPTIK</tspan></text>
    <text x="104" y="392" font-size="26" font-weight="600" fill="#3d4a7a">AI-Based Virtual Camera Tracking for Mobile FSOC Terminals</text>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="17" fill="#5c6694">
    <text x="104" y="432">COARSE ALIGNMENT  ·  COMPUTER VISION  ·  SIMULATION ENVIRONMENT</text>
  </g>
  <!-- centre crosshair with subtle rotation for motion -->
  <g transform="translate(1056 315)" opacity="0.28">
    <g stroke="#3d4a7a" stroke-width="1.6" stroke-linecap="round" class="spin-cross">
      <path d="M-70 0 H-50 M70 0 H50 M0 -70 V-50 M0 70 V50"/>
    </g>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#3d4a7a" stroke-width="1.4" class="dash-ring"/>
    <circle cx="0" cy="0" r="3.2" fill="#3d4a7a"/>
  </g>
  <style>
    @keyframes crosshair-rotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes ring-pulse { 0%,100%{opacity:0.55} 50%{opacity:0.2} }
    .spin-cross { transform-box: fill-box; transform-origin: center; animation: crosshair-rotate 14s linear infinite; }
    .dash-ring { animation: ring-pulse 3.4s ease-in-out infinite; }
  </style>
  <rect x="104" y="456" width="360" height="44" rx="22" fill="#e7ebfa"/>
  <text x="124" y="484" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="#5c6694">PROTOTYPE  ·  NOT AN ISRO PRODUCT</text>
  <!-- orbital hint -->
  <g transform="translate(900 210)" opacity="0.88">
    <circle cx="0" cy="0" r="132" fill="none" stroke="#aab3dd" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="94" fill="none" stroke="#aab3dd" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#aab3dd" stroke-width="1.6"/>
    <path d="M-132 0h264M0 -132v264" stroke="#aab3dd" stroke-width="1.2"/>
    <rect x="46" y="-40" width="72" height="72" rx="16" fill="none" stroke="url(#og-mark)" stroke-width="4.5"/>
    <path d="M118 0h44" stroke="url(#og-mark)" stroke-width="3.5" stroke-dasharray="8 7"/>
    <circle cx="82" cy="-4" r="4.5" fill="url(#og-mark)"/>
  </g>
</svg>
