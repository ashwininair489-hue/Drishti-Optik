<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Drishti-Optik logo">
  <defs>
    <linearGradient id="drishti-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c86ff" />
      <stop offset="55%" stop-color="#6fb8e8" />
      <stop offset="100%" stop-color="#5ec4d4" />
    </linearGradient>
    <radialGradient id="drishti-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2744" />
      <stop offset="58%" stop-color="#1e3a5e" />
      <stop offset="100%" stop-color="#0f1d33" />
    </radialGradient>
    <filter id="drishti-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2d3560" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- rounded square canvas -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#drishti-bg)" filter="url(#drishti-soft)"/>
  <!-- outer aperture ring -->
  <circle cx="48" cy="48" r="28" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.6" opacity="0.92"/>
  <circle cx="48" cy="48" r="22.5" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="0.9" stroke-dasharray="3.2 3.2" opacity="0.9"/>
  <!-- eye / iris -->
  <circle cx="48" cy="48" r="16.5" fill="url(#drishti-iris)" stroke="rgba(255,255,255,0.85)" stroke-width="1.1"/>
  <!-- inner iris highlight ring -->
  <circle cx="48" cy="48" r="10.5" fill="none" stroke="#7fd4ee" stroke-width="1.15" opacity="0.9"/>
  <!-- pupil -->
  <circle cx="48" cy="48" r="5.2" fill="#0b1628" stroke="rgba(255,255,255,0.35)" stroke-width="0.7"/>
  <!-- specular highlight -->
  <ellipse cx="45.2" cy="44.2" rx="2.3" ry="1.7" fill="rgba(255,255,255,0.72)"/>
  <!-- crosshair -->
  <g stroke="#f6f8ff" stroke-linecap="round" opacity="0.95">
    <path d="M48 20.5 V30 M48 66 V75.5 M20.5 48 H30 M66 48 H75.5" stroke-width="2.1"/>
    <circle cx="48" cy="48" r="1.35" fill="#f6f8ff" stroke="none"/>
  </g>
  <!-- corner aperture ticks -->
  <g stroke="rgba(255,255,255,0.62)" stroke-width="1.35" stroke-linecap="round" fill="none">
    <path d="M14 26 V16 H24"/>
    <path d="M72 16 H82 V26"/>
    <path d="M82 70 V80 H72"/>
    <path d="M24 80 H14 V70"/>
  </g>
</svg>
